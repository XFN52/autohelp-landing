<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Bold Orange Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="144" fill="#FF6B00"/>
  
  <!-- Subtle inner gradient for premium depth -->
  <rect x="0" y="0" width="512" height="512" rx="144" fill="url(#grad)" opacity="0.25"/>
  
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Clean Bold Typography: 'A24' Monogram -->
  <text x="256" y="325" 
        font-family="'Oswald', 'Arial Black', sans-serif" 
        font-size="270" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-12">A24</text>
  
  <!-- Emergency Lightning Streak underneath -->
  <path d="M140,380 L372,380 L340,410 L172,410 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>
